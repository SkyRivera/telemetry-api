services:
  postgres:
    image: postgres:16-alpine
    container_name: telemetry-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    # No se publica el puerto 5432 en producción
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - telemetry-net

  telemetry-api:
    build: .
    container_name: telemetry-api
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      API_KEY_ESP32: ${API_KEY_ESP32}
      API_KEY_API_B: ${API_KEY_API_B}
      READ_REQUEST_TIMEOUT_SECONDS: ${READ_REQUEST_TIMEOUT_SECONDS:-300}
      RATE_LIMIT_DEFAULT: ${RATE_LIMIT_DEFAULT:-100/minute}
      DEBUG: false
    depends_on:
      postgres:
        condition: service_healthy
    # No se publica el puerto 8000, solo Nginx accede a él
    restart: always
    networks:
      - telemetry-net

  nginx:
    image: nginx:alpine
    container_name: telemetry-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - telemetry-api
    restart: always
    networks:
      - telemetry-net

volumes:
  postgres_data:

networks:
  telemetry-net:
    driver: bridge